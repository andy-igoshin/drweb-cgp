################################################################################
# drweb-cgp config file
################################################################################

################################################################################
# Адрес хоста и порт DrWeb или UNIX-сокет, тайм-аут.
#
# host: "/run/.com.drweb.clamd"
# host: "1.2.3.4:3310"
#
host: "/run/.com.drweb.clamd"
timeout: 180s

################################################################################
# Копировать сообщения с вирусами на указанные адреса.
#
mirror-to: 
  - "admin@domain.name"

################################################################################
# Оповещения
#
# notifications:
#   from: "postmaster@domain.name" # устанавливает значение заголовка From:
#   authenticated: true            # отправлять оповещения аутентифицированным
#                                  # пользователям
#
#   external:
#     enable: true                 # отправлять оповещения внешним отправителям,
#                                  # если есть DKIM
#     domains:
#       allow: []                  # список разрещённых доменов. если пустой,
#                                  # отправлять всем с DKIM.
#       deny:  []                  # список запрещённых доменов, даже при
#                                  # наличии DKIM. имеет приоритет над allow.
#
notifications:
  from: "drweb-cgp-notify@domain.name"
  authenticated: true
  external:
    enable: true
    domains:
      allow: []
      deny:
        - "gmail.com"
        - "outlook.com"
        - "mail.ru"
        - "yandex.ru"
