################################################################################
# drweb-cgp config file
################################################################################

################################################################################
# Адрес DrWeb: UNIX-сокет или TCP (хост и порт), а также тайм-аут.
#
# Если значение host начинается с "/" — используется UNIX-сокет и механизм
# передачи файловых дескрипторов (FILDES).
#   host: "/run/.com.drweb.clamd"
#
# Иначе — TCP-соединение. Если порт не указан, автоматически добавляется
# порт по умолчанию :3310.
#   host: "1.2.3.4:3310"
#   host: "2001:db8::1"          # будет преобразовано в [2001:db8::1]:3310
#
# timeout — тайм-аут операций при взаимодействии с DrWeb.
# Значение по умолчанию: 180s
#
host: "/run/.com.drweb.clamd"
timeout: 180s

################################################################################
# Копировать сообщения с вирусами на указанные адреса.
#
# Список может быть пустым — тогда копии не пересылаются.
# При пересылке копии в обработанное сообщение автоматически добавляется
# заголовок X-DrWeb-Seen:, чтобы исключить повторную обработку или зацикливание.
#
mirror-to:
  - "admin@domain.name"

################################################################################
# Оповещения отправителю о факте обнаружения вируса.
#
# notifications:
#   from: "postmaster@domain.name" # устанавливает значение заголовка From:
#                                  # оповещения
#   authenticated: true            # отправлять оповещения аутентифицированным
#                                  # пользователям
#
#   external:
#     enable: true                 # отправлять оповещения внешним отправителям,
#                                  # если есть DKIM
#     domains:
#       allow: []                  # список разрешённых доменов. если пустой,
#                                  # отправлять всем с DKIM.
#       deny:  []                  # список запрещённых доменов, даже при
#                                  # наличии DKIM. имеет приоритет над allow.
#
# Проверка DKIM выполняется только при обнаружении вируса и только если
# оповещения включены.
#
notifications:
  from: "drweb-cgp-notify@domain.name"
  authenticated: true
  external:
    enable: true
    domains:
      allow: []
      deny:
        - "gmail.com"
        - "outlook.com"
        - "mail.ru"
        - "yandex.ru"
